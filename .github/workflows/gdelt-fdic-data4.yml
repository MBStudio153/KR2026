name: gdelt-fdic-data4
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - name: GDELT DOC API, term FDIC, one year per job, daily raw counts
        continue-on-error: true
        env:
          YEAR: ${{ matrix.year }}
        run: |
          mkdir -p out
          cat > q.py <<'PY'
          import os, random, time, urllib.request, urllib.parse
          yr = int(os.environ["YEAR"])
          log = open("out/log.txt", "w")
          time.sleep(random.random() * 900)
          start = "%d0101000000" % yr
          end = time.strftime("%Y%m%d235959") if yr >= 2026 else "%d1231235959" % yr
          VARIANTS = ['"FDIC"', 'FDIC', '(FDIC OR "Federal Deposit Insurance")']
          params = {"query": VARIANTS[0] + " sourcelang:english", "mode": "timelinevolraw", "format": "json",
                    "timelinesmooth": "0", "startdatetime": start, "enddatetime": end}
          def mkurl(v):
              params["query"] = v + " sourcelang:english"
              return "https://api.gdeltproject.org/api/v2/doc/doc?" + urllib.parse.urlencode(params)
          url = "https://api.gdeltproject.org/api/v2/doc/doc?" + urllib.parse.urlencode(params)
          err = ""
          for a in range(10):
              try:
                  url = mkurl(VARIANTS[a % len(VARIANTS)])
                  req = urllib.request.Request(url, headers={"User-Agent": "kaim-research/1.0"})
                  r = urllib.request.urlopen(req, timeout=180).read().decode("utf-8", "replace")
                  if r.startswith("{"):
                      open("out/banking_stability__fdic_%d.json" % yr, "w").write(r)
                      log.write("%d ok len=%d\n" % (yr, len(r)))
                      break
                  err = r[:80]
              except Exception as e:
                  err = repr(e)[:120]
              log.write("%d attempt %d variant %s %s\n" % (yr, a, VARIANTS[a % len(VARIANTS)], err)); log.flush()
              time.sleep(60 + 45 * a)
          log.close()
          PY
          python3 q.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdelt-fdic4-${{ matrix.year }}
          path: out/
  collect:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gdelt-fdic4-*
          path: all
      - name: Zip and commit
        run: |
          mkdir -p data/zips
          cd all && zip -r ../data/zips/gdelt-fdic-data4.zip . && cd ..
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add data/zips/gdelt-fdic-data4.zip
          git commit -m "Fetch GDELT FDIC counts by year" || true
          git push || true

